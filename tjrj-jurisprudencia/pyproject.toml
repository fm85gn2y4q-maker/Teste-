[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tjrj-jurisprudencia"
version = "0.1.0"
description = "Acervo pesquisável da jurisprudência do TJRJ, exposto via MCP"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",   # parser HTML rápido — importa em coleta de milhões de páginas
    "pypdf>=4.2",
    "striprtf>=0.0.26",
    "mcp>=1.2",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]  # exige tesseract-ocr e poppler no sistema
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
tjrj = "tjrj.cli:main"
tjrj-mcp = "tjrj.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tjrj"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
