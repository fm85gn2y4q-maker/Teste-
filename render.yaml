# Configuração do Ementário no Render.
#
# O nome do serviço define o endereço público (https://NOME.onrender.com) e
# precisa ser único entre todos os usuários do Render. Se trocar o `name`,
# troque também o `EMENTARIO_DOMINIOS` abaixo: o servidor recusa Host que não
# conheça, e a proteção não usa curinga.
services:
  - type: web
    name: ementario-tcerj
    runtime: docker
    rootDir: scraper-tcerj
    dockerfilePath: ./Dockerfile
    plan: free
    # Entre as regiões do plano gratuito, virginia é a de menor latência para
    # o Brasil.
    region: virginia
    envVars:
      - key: EMENTARIO_DOMINIOS
        value: ementario-tcerj.onrender.com
      # OAuth fica DESLIGADO de propósito. O ChatGPT aceita o servidor sem
      # autenticação, e o Claude também; ligar o fluxo exigiria reconectar os
      # dois. Para ativá-lo um dia, basta declarar EMENTARIO_URL_PUBLICA com o
      # endereço público — o código está pronto e testado em ementario/
      # autenticacao.py.
