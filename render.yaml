# Configuração do Ementário no Render.
#
# O nome do serviço define o endereço público (https://NOME.onrender.com) e
# precisa ser único entre todos os usuários do Render. Se trocar o `name`,
# troque também o `EMENTARIO_DOMINIOS` abaixo: o servidor recusa Host que não
# conheça, e a proteção não usa curinga.
services:
  - type: web
    name: ementario-tcerj
    runtime: docker
    rootDir: scraper-tcerj
    dockerfilePath: ./Dockerfile
    plan: free
    # A versão do acervo fica no Dockerfile, e não aqui: campo desconhecido
    # neste arquivo faz o Blueprint falhar inteiro, e argumento de build não é
    # repassado da mesma forma por todo serviço. Menos lugares onde errar.
    # Entre as regiões do plano gratuito, virginia é a de menor latência para
    # o Brasil.
    region: virginia
    envVars:
      - key: EMENTARIO_DOMINIOS
        value: ementario-tcerj.onrender.com
      # OAuth fica DESLIGADO de propósito. O ChatGPT aceita o servidor sem
      # autenticação, e o Claude também; ligar o fluxo exigiria reconectar os
      # dois. Para ativá-lo um dia, basta declarar EMENTARIO_URL_PUBLICA com o
      # endereço público — o código está pronto e testado em ementario/
      # autenticacao.py.

  # Normas do TCE-RJ: Deliberacoes, Resolucoes, Atos Normativos, Portarias,
  # Notas Tecnicas e Sumulas, inclusive o Regimento Interno.
  #
  # Servico separado do Ementario, e a razao nao e organizacional: num acervo
  # de jurisprudencia a pergunta perigosa e de quem e o trecho; num de normas e
  # se ainda vale. Sao reguas diferentes, e um servidor so embaçaria as duas.
  #
  # O acervo tem 22 MB — o menor dos tres.
  - type: web
    name: normas-tcerj
    runtime: docker
    rootDir: normas-tcerj
    dockerfilePath: ./Dockerfile
    plan: free
    region: virginia
    envVars:
      - key: NORMAS_DOMINIOS
        value: normas-tcerj.onrender.com

  # Pareceres da PGE-RJ. Servico separado de proposito: parecer da PGE, da AGU
  # e de outra PGE tem graus de autoridade diferentes, e num acervo so essa
  # diferenca vira metadado ignoravel.
  #
  # ATENCAO ao plano: o acervo tem 766 MB dentro da imagem, contra ~10 MB do
  # Ementario. O plano gratuito do Render pode nao comportar. Ver HOSPEDAGEM.md
  # em pareceres-pge-rj/ antes do primeiro deploy.
  - type: web
    name: pareceres-pge-rj
    runtime: docker
    rootDir: pareceres-pge-rj
    dockerfilePath: ./Dockerfile
    plan: free
    region: virginia
    envVars:
      - key: PARECERES_DOMINIOS
        # O Render acrescentou sufixo ao criar: o nome limpo ja estava
        # ocupado. O dominio tem de ser o REAL, senao a protecao de Host
        # recusa tudo com 421 -- ela compara exatamente, sem curinga.
        value: pareceres-pge-rj-kip3.onrender.com

  # Acervo consultivo da AGU: CONUNI, Orientacoes Normativas e Sumulas.
  # Servico separado pelo mesmo motivo dos outros dois: parecer da AGU, da
  # PGE-RJ e do TCE-RJ tem graus de autoridade diferentes, e num acervo so
  # essa diferenca vira metadado ignoravel.
  #
  # Este cabe folgado no plano gratuito -- sao dezenas de MB, contra os 766 MB
  # do acervo da PGE-RJ. Pelo motivo menos animador possivel: 1.115 das 1.724
  # manifestacoes do CONUNI nao tem inteiro teor publico.
  - type: web
    name: consultivo-agu
    runtime: docker
    rootDir: pareceres-agu
    dockerfilePath: ./Dockerfile
    plan: free
    region: virginia
    envVars:
      - key: AGU_DOMINIOS
        # ATENCAO: trocar pelo dominio REAL depois de criar o servico. O
        # Render acrescenta sufixo quando o nome limpo ja esta ocupado, e foi
        # exatamente o que aconteceu com os pareceres da PGE-RJ. Enquanto o
        # valor nao for o real, o servico recusa tudo com 421.
        value: consultivo-agu.onrender.com
